apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: researchmind-ingress
  namespace: researchmind
  labels:
    app.kubernetes.io/name: researchmind
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - researchmind.yourdomain.com
      secretName: researchmind-tls-cert
  rules:
    - host: researchmind.yourdomain.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: researchmind-backend
                port:
                  number: 8000
          - path: /health
            pathType: Exact
            backend:
              service:
                name: researchmind-backend
                port:
                  number: 8000
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: researchmind-backend
                port:
                  number: 8000
          - path: /openapi.json
            pathType: Exact
            backend:
              service:
                name: researchmind-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: researchmind-frontend
                port:
                  number: 80
