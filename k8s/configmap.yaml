apiVersion: v1
kind: ConfigMap
metadata:
  name: researchmind-config
  namespace: researchmind
  labels:
    app.kubernetes.io/name: researchmind
data:
  HOST: "0.0.0.0"
  PORT: "8000"
  ENV: "production"
  DATA_DIR: "/app/data"
  UPLOAD_DIR: "/app/uploads"
  FRONTEND_URL: "https://researchmind.yourdomain.com"
  BACKEND_URL: "https://researchmind.yourdomain.com/api"
  CORS_ORIGINS: "https://researchmind.yourdomain.com,http://localhost:5173,http://localhost:4173"
  ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
  GEMINI_MODEL: "gemini-3.6-flash"
  GROQ_MODEL: "openai/gpt-oss-120b"
  SMTP_PORT: "587"
  EMAIL_FROM: "ResearchMind AI <noreply@researchmind.ai>"
