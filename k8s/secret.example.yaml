apiVersion: v1
kind: Secret
metadata:
  name: researchmind-secrets
  namespace: researchmind
  labels:
    app.kubernetes.io/name: researchmind
type: Opaque
stringData:
  # Base64 encoded or stringData for kubectl
  SECRET_KEY: "change-this-to-a-strong-random-secret-key-in-production"
  GEMINI_API_KEY: "your-google-gemini-api-key"
  GROQ_API_KEY: "your-groq-api-key"
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  SMTP_HOST: ""
  SMTP_USER: ""
  SMTP_PASSWORD: ""
