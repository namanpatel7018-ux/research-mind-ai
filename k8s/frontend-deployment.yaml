apiVersion: apps/v1
kind: Deployment
metadata:
  name: researchmind-frontend
  namespace: researchmind
  labels:
    app.kubernetes.io/name: researchmind-frontend
    app.kubernetes.io/part-of: researchmind-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: researchmind-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: researchmind-frontend
    spec:
      containers:
        - name: frontend
          image: researchmind-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
