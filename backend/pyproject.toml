[project]
name = "researchmind_ai_backend"
version = "0.1.0"
description = "ResearchMind AI backend API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.109.0",
  "uvicorn[standard]>=0.23.0",
  "pydantic>=2.9.0",
  "sqlmodel>=0.0.8",
  "psycopg[binary]>=3.2.0",
  "python-dotenv>=1.0.0",
  "langchain>=0.0.340",
  "chromadb>=0.15.0",
  "openai>=1.0.0",
  "python-multipart>=0.0.6",
  "python-jose>=3.0.1",
  "passlib>=1.7.0",
  "httpx>=0.25.0",
  "google-auth>=2.16.0",
  "google-auth-oauthlib>=1.0.0",
  "google-genai>=2.25.0",
  "groq>=0.11.0",
  "pypdf>=3.0.0",
  "python-pptx>=0.6.21",
  "reportlab>=4.0.0",
  "pymupdf>=1.24.0",
  "python-docx>=1.1.0",
  "rank-bm25>=0.2.2",
  "qdrant-client>=1.9.0",
  "flashrank>=0.2.10",
  "pyyaml>=6.0.0",
  "requests>=2.31.0"
]

[project.scripts]
start = "uvicorn app.main:app --host 0.0.0.0 --port 8000"
